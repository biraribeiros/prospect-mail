<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prospector</title>
<style>
  body { width: 320px; margin: 0; padding: 14px; font: 14px system-ui, sans-serif; color: #1c2430; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { color: #5b6573; font-size: 12px; margin: 0 0 10px; }
  button { width: 100%; padding: 9px; margin: 4px 0; border: 1px solid #c7ced8; border-radius: 6px; background: #fff; font-size: 14px; cursor: pointer; }
  button.p { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  label.t { display: flex; gap: 8px; align-items: center; margin: 10px 0; }
  input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 7px; margin: 3px 0 8px; border: 1px solid #c7ced8; border-radius: 6px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; text-align: center; }
  .stats div { background: #f4f6f9; border-radius: 6px; padding: 6px 2px; }
  .stats b { display: block; font-size: 18px; }
  .stats span { font-size: 11px; color: #5b6573; }
  #msg { margin: 8px 0; font-size: 13px; min-height: 18px; }
  .ok { color: #1b7f3b; } .erro { color: #b3261e; }
  details { margin-top: 8px; } summary { cursor: pointer; color: #1f6feb; }
  a { color: #1f6feb; font-size: 13px; }
</style>
</head>
<body>
  <h1>Prospector</h1>
  <p class="sub" id="estado">Carregando...</p>
  <button class="p" id="coletar">Coletar desta pagina</button>
  <label class="t"><input type="checkbox" id="auto"> Coleta automatica (cada pagina que eu abrir)</label>
  <div class="stats">
    <div><b id="s-col">0</b><span>coletados</span></div>
    <div><b id="s-novos">0</b><span>novos no sistema</span></div>
    <div><b id="s-ja">0</b><span>ja existiam</span></div>
  </div>
  <div id="msg"></div>
  <details id="config">
    <summary>Configurar</summary>
    <label for="servidor">Endereco do Prospector</label>
    <input type="text" id="servidor" placeholder="http://localhost:8000">
    <label for="chave">Chave (gerada em Hunter, Extensao)</label>
    <input type="password" id="chave" placeholder="pxt_..." autocomplete="off">
    <button id="salvar">Salvar e testar conexao</button>
  </details>
  <p><a href="#" id="abrir">Abrir contatos coletados</a></p>
  <script src="popup.js"></script>
</body>
</html>
