name: prospector

x-app: &app
  build: .
  image: prospector-app:dev
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-prospector}:${POSTGRES_PASSWORD:-prospector}@postgres:5432/${POSTGRES_DB:-prospector}
    REDIS_URL: redis://redis:6379/0
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
  volumes:
    - .:/srv
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prospector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospector}
      POSTGRES_DB: ${POSTGRES_DB:-prospector}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prospector}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  rspamd:
    image: rspamd/rspamd:latest
    ports:
      - "127.0.0.1:11334:11334"

  app:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: ["arq", "app.workers.worker.WorkerSettings"]

volumes:
  pgdata:
